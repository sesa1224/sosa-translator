<style>

  const f = t.closest("[data-f]"); if (f) { closePal(); S.view = "text"; S.filter = f.dataset.f; S.fade = true; draw(); return; }
  const th = t.closest("[data-t]"); if (th) { S.theme = +th.dataset.t; theme(); return; }
  const row = t.closest("tr[data-k]"); if (row) { select(+row.dataset.k); return; }
  const use = t.closest("[data-use]"); if (use) { setText(S._tm[+use.dataset.use].r.tr); flash($("tr")); return; }
  if (t.closest("[data-draft]")) { setText(DATA[S.sel].draft); flash($("tr")); return; }
  if (t.closest("#bigbtn") || t.closest("#small")) { S.big = !S.big; S.justBig = S.big; draw(); return; }
  if (t.closest("#prev")) { select(S.sel - 1); return; } if (t.closest("#next")) { select(S.sel + 1); return; }
  if (t.closest("#approve")) { const prev = S.sel, r = DATA[prev], good = r.tr && !check(r).some((c) => c[0] === "bad"); if (!good) { const c = $("chk"); c.classList.remove("shake"); void c.offsetWidth; c.classList.add("shake"); return; }
    r.st = "ok"; select(prev + 1); const tr = document.querySelector(`tr[data-k="${prev}"]`); if (tr) { tr.classList.add("rowflash"); const p = tr.querySelector(".pill"); if (p) p.classList.add("pop"); } return; }
  if (t.closest("#t-item")) { S.tab = "item"; drawRight(); icons(); return; } if (t.closest("#t-chat")) { S.tab = "chat"; drawRight(); icons(); } });

function theme() { const w = $("win"), t = THEMES[S.theme]; K.forEach((k, n) => t[2] ? w.style.setProperty("--" + k, t[2].split(" ")[n]) : w.style.removeProperty("--" + k)); w.className = "win " + t[1];
  $("themes").innerHTML = THEMES.map((x, i) => `<button type="button" class="tchip ${i === S.theme ? "on" : ""}" data-t="${i}"><i style="background:${x[3]}"></i>${x[0]}</button>`).join(""); }
theme(); draw();
</script>
