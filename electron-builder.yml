appId: app.sosa.translator
productName: SoSa Translator
copyright: ""
directories:
  output: release
files:
  - out/**
  - package.json
  # Bundled into out/renderer by Vite; not needed again at runtime.
  - "!node_modules/@fontsource/**"
  - "!node_modules/react/**"
  - "!node_modules/react-dom/**"
  - "!node_modules/@tanstack/**"
  - "!node_modules/scheduler/**"
# The MCP server script is started by the Claude CLI as a separate process
# (Electron running as Node), so keep the app as plain files instead of an archive.
asar: false
npmRebuild: false
# Keep only the UI languages the app can plausibly run in.
electronLanguages:
  - ko
  - en-US
  - ja
# App updates (src/main/appUpdate.ts) come from this repository's GitHub Releases. With this set the build also
# writes latest.yml next to the installer and app-update.yml into the app; both must be uploaded with the
# release (npm run release does it). Published directly (not as a draft) so a release run by Claude reaches
# users without a manual step on GitHub.
publish:
  provider: github
  owner: sesa1224
  repo: sosa-translator
  releaseType: release
win:
  # Only the installer: a copy unpacked from a zip cannot replace itself, so it would never update.
  target:
    - nsis
  # No code-signing certificate; skip the signing/resource-editing step.
  signAndEditExecutable: false
nsis:
  oneClick: true
  perMachine: false
  shortcutName: SoSa Translator
